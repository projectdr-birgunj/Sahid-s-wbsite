<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | Amaan Door & Hardware Suppliers</title>
  <meta name="description" content="Browse doors, ply, laminates, glass, hardware, nets, beats, adhesive, PVC edge banding and kitchen tools.">
  <link rel="icon" href="img/thumb/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header"><div id="site-header"></div></header>

  <main>
    <div class="page-hero">
      <div class="container">
        <span class="eyebrow">Full catalogue</span>
        <h1>Browse every category</h1>
        <p>Tap a category to view the full gallery. Every photo opens in full quality — pinch or scroll to zoom in on the details.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="cat-grid" id="all-cat-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div id="site-footer"></div></footer>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      const grid = document.getElementById("all-cat-grid");
      grid.innerHTML = CATEGORY_ORDER.map((key) => {
        const cat = CATALOG[key];
        const count = cat.groups.reduce((n, g) => n + g.items.length, 0);
        return `
          <a class="cat-card" href="product.html?cat=${key}">
            <div class="img-wrap lazy-frame">
              <img data-src="img/thumb/${cat.cover}.webp" alt="${cat.title}">
            </div>
            <div class="label">${cat.title}<small>${count} photo${count === 1 ? "" : "s"}</small></div>
          </a>`;
      }).join("");
      window.SiteUI.initLazyImages(grid);
    })();
  </script>
</body>
</html>
